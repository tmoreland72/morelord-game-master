# Dispatch from the master branch after this workflow is on master.
# In-Foundry tests are not part of this workflow.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump when version is empty and publish_only is false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: Explicit x.y.z. Empty bumps, or uses module.json when publish_only is true.
        type: string
        required: false
      publish_only:
        description: Publish an existing version to the website and Foundry only
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require the master branch
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/master') {
            throw "Dispatch this workflow from the master branch. Current ref: $env:GITHUB_REF"
          }

      - name: Require publish secrets
        env:
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_PUBLISH_TOKEN)) {
            throw 'RELEASE_PUBLISH_TOKEN is empty. Add it under Settings > Secrets and variables > Actions.'
          }
          if ([string]::IsNullOrWhiteSpace($env:FOUNDRY_RELEASE_TOKEN)) {
            throw 'FOUNDRY_RELEASE_TOKEN is empty. Add it under Settings > Secrets and variables > Actions.'
          }

      - name: Checkout Game Master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Public repo. Owner is tmoreland72, the same githubOwner as this
      # repository. tmorelord72/morelord-core does not exist, and checkout
      # fails there with Not Found while resolving the default branch.
      # The job GITHUB_TOKEN can read the public repository.
      - name: Checkout Morelord Core
        if: ${{ inputs.publish_only == false }}
        uses: actions/checkout@v4
        with:
          repository: tmoreland72/morelord-core
          path: morelord-core-checkout
          token: ${{ github.token }}

      - name: Place Morelord Core beside this repository
        if: ${{ inputs.publish_only == false }}
        run: |
          $dest = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'morelord-core'
          $source = Join-Path $env:GITHUB_WORKSPACE 'morelord-core-checkout'
          if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
          Move-Item -LiteralPath $source -Destination $dest
          $identity = Join-Path $dest 'scripts/services/delerium-search.js'
          if (-not (Test-Path -LiteralPath $identity)) {
            throw "morelord-core is missing $identity. Tests import that sibling path."
          }

      # Public repo. Omitting ref checks out the default branch. The job
      # GITHUB_TOKEN can read the public repository.
      - name: Checkout Morelord Journeys
        if: ${{ inputs.publish_only == false }}
        uses: actions/checkout@v4
        with:
          repository: tmoreland72/morelord-journeys
          path: morelord-journeys-checkout
          token: ${{ github.token }}

      - name: Place Journeys beside this repository
        if: ${{ inputs.publish_only == false }}
        run: |
          $dest = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'morelord-journeys'
          $source = Join-Path $env:GITHUB_WORKSPACE 'morelord-journeys-checkout'
          if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
          Move-Item -LiteralPath $source -Destination $dest
          $identity = Join-Path $dest 'scripts/domain/route-options.mjs'
          if (-not (Test-Path -LiteralPath $identity)) {
            throw "morelord-journeys is missing $identity. Tests import that sibling path."
          }

      - name: Setup Node
        if: ${{ inputs.publish_only == false }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run unit tests
        if: ${{ inputs.publish_only == false }}
        # Node treats a quoted glob as one literal path
        # (Could not find tests/*.test.mjs). PowerShell resolves the maintained
        # tests/*.test.mjs files, the same way the other Morelord release
        # workflows do. Names are sorted so the set is stable. Live Foundry
        # scripts and tests/*.test.cjs stay out of this list; npm test is the
        # same *.test.mjs set.
        run: |
          $tests = @(Get-ChildItem -LiteralPath tests -Filter *.test.mjs -File | Sort-Object -Property Name)
          if ($tests.Count -eq 0) { throw 'No tests/*.test.mjs files were found.' }
          node --test @($tests.FullName)

      - name: Resolve release version
        id: version
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
        run: |
          $resolverArgs = @{
            ModuleManifest = 'module.json'
            Bump = $(if ([string]::IsNullOrWhiteSpace($env:INPUT_BUMP)) { 'patch' } else { $env:INPUT_BUMP })
          }
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION)) {
            $resolverArgs.Version = $env:INPUT_VERSION
          }
          if ($env:PUBLISH_ONLY -eq 'true') { $resolverArgs.PublishOnly = $true }
          $version = (& ./tools/resolve-release-version.ps1 @resolverArgs | Select-Object -Last 1).ToString().Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Version resolver returned a value that is not x.y.z.' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8NoBOM
          Write-Host "Resolved release version $version"

      - name: Bump documentation versions
        if: ${{ inputs.publish_only == false }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        # release.ps1 requires docs/README.md to already be this version and the worktree to be clean.
        run: |
          $version = $env:RELEASE_VERSION.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Release version '$version' is not x.y.z." }
          $utf8 = New-Object System.Text.UTF8Encoding $false
          function Update-ReleaseVersion {
            param(
              [Parameter(Mandatory = $true)][string]$RelativePath,
              [Parameter(Mandatory = $true)][string]$Pattern,
              [Parameter(Mandatory = $true)][string]$Replacement
            )
            $path = Join-Path $env:GITHUB_WORKSPACE $RelativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Documentation file was not found: $RelativePath" }
            $text = [System.IO.File]::ReadAllText($path)
            $updated = [regex]::Replace($text, $Pattern, $Replacement)
            if ($updated -eq $text) { return }
            [System.IO.File]::WriteAllText($path, $updated, $utf8)
            Write-Host "Updated $RelativePath to version $version"
          }
          Update-ReleaseVersion -RelativePath 'docs/README.md' -Pattern '(?m)^version:\s*\d+\.\d+\.\d+\s*$' -Replacement "version: $version"
          Update-ReleaseVersion -RelativePath 'README.md' -Pattern '(?m)^Version \d+\.\d+\.\d+\.\s*$' -Replacement "Version $version."
          Update-ReleaseVersion -RelativePath 'package.json' -Pattern '(?m)^(\s*"version":\s*")\d+\.\d+\.\d+(")' -Replacement "`${1}$version`${2}"
          git add -- docs/README.md README.md package.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Documentation is already at version $version."
          }
          else {
            git commit -m "Set documentation to version $version."
            if ($LASTEXITCODE -ne 0) { throw 'Documentation version commit failed.' }
          }

      - name: Publish existing release
        if: ${{ inputs.publish_only }}
        env:
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./release.ps1 -Version $env:RELEASE_VERSION -WebsiteOnly
          ./release.ps1 -Version $env:RELEASE_VERSION -FoundryOnly

      - name: Create GitHub release
        if: ${{ inputs.publish_only == false }}
        env:
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        # release.ps1 rebuilds CHANGELOG.md, puts it at the zip root, and commits it with module.json.
        # Archive paths stay in release.config.json: requiredPaths, plus optionalPaths that exist.
        # One invocation creates the GitHub Release and publishes Foundry and the website.
        run: ./release.ps1 -Version $env:RELEASE_VERSION
