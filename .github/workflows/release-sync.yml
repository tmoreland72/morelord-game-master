name: Sync manifest release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: game-master-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          sparse-checkout: |
            scripts
            tests
            release-notes
            module.json
            release.config.json
            CHANGELOG.md
      - run: node scripts/changelog.cjs --check
      - run: node --test tests/release-sync.test.cjs tests/publish-website-release.test.cjs tests/changelog.test.mjs
      - id: sync
        uses: actions/github-script@v8
        with:
          script: |
            const result = await require('./scripts/release-sync.cjs')({ github, context, core });
            core.setOutput('publish', result.publishWebsite ? 'true' : 'false');
            core.setOutput('version', result.version);
            core.setOutput('github_release_url', result.githubReleaseUrl || '');
      - name: Publish release to morelordgaming.com
        if: steps.sync.outputs.publish == 'true'
        env:
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          WEBSITE_URL: ${{ vars.WEBSITE_URL }}
          RELEASE_VERSION: ${{ steps.sync.outputs.version }}
          GITHUB_RELEASE_URL: ${{ steps.sync.outputs.github_release_url }}
        run: node scripts/publish-website-release.cjs
